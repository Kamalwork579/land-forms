<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة الحمد للاستثمار الزراعي والعقاري - طلب شراء أرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --soil-900:#2b1f16;
    --soil-700:#4a3525;
    --wheat-100:#f4ecd9;
    --wheat-50:#faf6ec;
    --canal-500:#2f6e6a;
    --canal-700:#214f4c;
    --gold-600:#9c7a2e;
    --rust-500:#b5532e;
    --paper:#fffdf8;
    --line:#d9cdb0;
    --ink:#2b1f16;
    --ink-soft:#6b5d4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--wheat-100);
    font-family:'Cairo', sans-serif;
    color:var(--ink);
    min-height:100vh;
    direction:rtl;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 80px;}

  .hero{
    padding:48px 18px 36px;
    position:relative;
    background:var(--canal-700);
    color:var(--wheat-50);
    margin-bottom:28px;
  }
  .hero-inner{max-width:760px;margin:0 auto;}
  h1.title{
    font-family:'Markazi Text', serif;
    font-size:clamp(34px,6vw,46px);
    margin:18px 0 8px;
    font-weight:700;
  }

  .section{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 22px;
    margin-bottom:18px;
  }
  .section-head{
    display:flex; align-items:baseline; gap:10px;
    margin-bottom:18px; padding-bottom:14px;
    border-bottom:1px dashed var(--line);
  }
  .section-num{
    font-family:'Markazi Text', serif;
    font-size:26px; color:var(--gold-600); font-weight:700;
  }
  .section-title{font-size:18px; font-weight:800; color:var(--soil-900);}

  .field{margin-bottom:18px;}
  label.flabel{
    display:block; font-size:14.5px; font-weight:700; color:var(--soil-700);
    margin-bottom:8px;
  }
  label.flabel .req{color:var(--rust-500); margin-right:4px;}

  input[type=text], input[type=tel], textarea{
    width:100%; padding:13px 14px; border-radius:9px;
    border:1.5px solid var(--line); background:var(--wheat-50);
  }

  .chip-grid{display:flex; flex-wrap:wrap; gap:9px;}
  .chip{position:relative;}
  .chip input{position:absolute; opacity:0; width:1px; height:1px;}
  .chip label{
    display:flex; align-items:center; gap:7px;
    padding:10px 16px; border-radius:9px;
    border:1.5px solid var(--line); background:var(--wheat-50);
    font-size:14.5px; font-weight:600; color:var(--soil-700);
    cursor:pointer;
  }
  .chip label::before{
    content:""; width:15px; height:15px; border-radius:50%;
    border:2px solid #c2b394; flex-shrink:0;
  }
  .chip.multi label::before{border-radius:4px;}
  .chip input:checked + label{
    background:var(--gold-600); border-color:var(--gold-600); color:#fff;
  }

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){.row2{grid-template-columns:1fr;}}

  .conditional{
    margin-top:14px; padding:14px 14px; border-radius:10px;
    background:var(--wheat-100); border:1px dashed var(--gold-600);
    display:none;
  }
  .conditional.show{display:block;}

  button.submit{
    width:100%; background:var(--canal-700); color:#fff; border:none;
    font-weight:800; font-size:17px; padding:17px 20px; border-radius:11px; cursor:pointer;
  }
  .error-box{
    background:#fbe9e2; border:1px solid #e2a98c; color:#8a3d20;
    border-radius:10px; padding:13px 14px; font-size:14px; margin-top:14px; display:none;
  }
  .error-box.show{display:block;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <h1 class="title">استمارة طلب الشراء</h1>
  </div>
</div>

<div class="wrap">
  <div id="formScreen">
    <form id="buyerForm" novalidate>

      <div class="section">
        <div class="section-head">
          <span class="section-num">01</span>
          <span class="section-title">بيانات المشتري</span>
        </div>
        <div class="field">
          <label class="flabel">الاسم<span class="req">*</span></label>
          <input type="text" name="buyer_name" required placeholder="الاسم بالكامل">
        </div>
        <div class="row2">
          <div class="field">
            <label class="flabel">التليفون<span class="req">*</span></label>
            <input type="tel" name="buyer_phone" required placeholder="01xxxxxxxxx" inputmode="tel">
          </div>
          <div class="field">
            <label class="flabel">العنوان</label>
            <input type="text" name="buyer_address" placeholder="العنوان بالتفصيل">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <span class="section-num">02</span>
          <span class="section-title">مواصفات الأرض المطلوبة</span>
        </div>

        <div class="row2">
          <div class="field">
            <label class="flabel">المساحة المطلوبة<span class="req">*</span></label>
            <input type="text" name="required_area" required placeholder="مثال: من 3 إلى 5 فدان">
          </div>
          <div class="field">
            <label class="flabel">المكان<span class="req">*</span></label>
            <input type="text" name="required_location" required placeholder="المحافظة / المركز المفضّل">
          </div>
        </div>

        <div class="field">
          <label class="flabel">نوع الري<span class="req">*</span></label>
          <div class="chip-grid">
            <div class="chip"><input type="radio" name="irrigation" id="irr1" value="بحاري" required><label for="irr1">بحاري</label></div>
            <div class="chip"><input type="radio" name="irrigation" id="irr2" value="آبار أعماق"><label for="irr2">آبار أعماق</label></div>
            <div class="chip"><input type="radio" name="irrigation" id="irr4" value="بحاري وآبار"><label for="irr4">بحاري وآبار</label></div>
            <div class="chip"><input type="radio" name="irrigation" id="irr5" value="بحاري وخزان"><label for="irr5">بحاري وخزان</label></div>
            <div class="chip"><input type="radio" name="irrigation" id="irr6" value="مش فارقة"><label for="irr6">مش فارقة</label></div>
          </div>
          <div class="conditional" id="salinityBox">
            <div class="field">
              <label class="flabel">نسبة ملوحة المياه المقبولة</label>
              <input type="text" name="water_salinity" placeholder="نسبة الملوحة المطلوبة">
            </div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">نوع التربة<span class="req">*</span></label>
          <div class="chip-grid">
            <div class="chip"><input type="radio" name="soil_type" id="soil1" value="طينية" required><label for="soil1">طينية</label></div>
            <div class="chip"><input type="radio" name="soil_type" id="soil2" value="صفرا"><label for="soil2">صفرا</label></div>
            <div class="chip"><input type="radio" name="soil_type" id="soil3" value="طفلة"><label for="soil3">طفلة</label></div>
            <div class="chip"><input type="radio" name="soil_type" id="soil4" value="حمرا"><label for="soil4">حمرا</label></div>
            <div class="chip"><input type="radio" name="soil_type" id="soil5" value="سفوة"><label for="soil5">سفوة</label></div>
            <div class="chip"><input type="radio" name="soil_type" id="soil6" value="مش فارقة"><label for="soil6">مش فارقة</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">حالة الأرض المرغوبة<span class="req">*</span></label>
          <div class="chip-grid">
            <div class="chip"><input type="radio" name="desired_land_status" id="dstatus1" value="متشجرة بالكامل" required><label for="dstatus1">متشجرة بالكامل</label></div>
            <div class="chip"><input type="radio" name="desired_land_status" id="dstatus2" value="محاصيل بالكامل"><label for="dstatus2">محاصيل بالكامل</label></div>
            <div class="chip"><input type="radio" name="desired_land_status" id="dstatus3" value="جزء متشجر وجزء محاصيل"><label for="dstatus3">جزء متشجر وجزء محاصيل</label></div>
            <div class="chip"><input type="radio" name="desired_land_status" id="dstatus4" value="مش فارقة"><label for="dstatus4">مش فارقة</label></div>
          </div>
          <div class="conditional" id="treeTypeBox">
            <div class="field">
              <label class="flabel">نوع الشجر والتفصيل المقبول<span class="req">*</span></label>
              <input type="text" name="tree_types" id="tree_types" placeholder="نوع الشجر المفضل (عنب، موالح...)">
            </div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">الخدمات المطلوبة</label>
          <div class="chip-grid">
            <div class="chip multi"><input type="checkbox" name="services" id="serv1" value="كهرباء"><label for="serv1">كهرباء</label></div>
            <div class="chip multi"><input type="checkbox" name="services" id="serv2" value="مياه شرب"><label for="serv2">مياه شرب</label></div>
            <div class="chip multi"><input type="checkbox" name="services" id="serv3" value="طاقة شمسية"><label for="serv3">طاقة شمسية</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">المباني المطلوبة (اختيار متعدد)</label>
          <div class="chip-grid">
            <div class="chip multi"><input type="checkbox" name="buildings" id="bld1" value="فيلا"><label for="bld1">فيلا</label></div>
            <div class="chip multi"><input type="checkbox" name="buildings" id="bld2" value="بيت مسلح"><label for="bld2">بيت مسلح</label></div>
            <div class="chip multi"><input type="checkbox" name="buildings" id="bld3" value="بيت ريفي"><label for="bld3">بيت ريفي</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">الموقع المفضّل (اختيار متعدد)</label>
          <div class="chip-grid">
            <div class="chip multi"><input type="checkbox" name="road_location" id="rd1" value="طريق عمومي"><label for="rd1">على طريق عمومي</label></div>
            <div class="chip multi"><input type="checkbox" name="road_location" id="rd2" value="طريق فرعي"><label for="rd2">طريق فرعي</label></div>
            <div class="chip multi"><input type="checkbox" name="road_location" id="rd3" value="مدق"><label for="rd3">مدق</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">الغرض من الشراء</label>
          <div class="chip-grid">
            <div class="chip"><input type="radio" name="purpose" id="pur1" value="إعادة بيع"><label for="pur1">إعادة بيع</label></div>
            <div class="chip"><input type="radio" name="purpose" id="pur2" value="استثمار زراعي"><label for="pur2">استثمار زراعي</label></div>
            <div class="chip"><input type="radio" name="purpose" id="pur3" value="داجني"><label for="pur3">داجني</label></div>
            <div class="chip"><input type="radio" name="purpose" id="pur4" value="محطة تصدير"><label for="pur4">محطة تصدير</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">مواصفات أخرى</label>
          <textarea name="other_specs" placeholder="أي تفاصيل إضافية أو شروط خاصة..."></textarea>
        </div>
      </div>

      <div class="error-box" id="errorBox"></div>
      <div class="submit-bar">
        <button type="submit" class="submit" id="submitBtn">إرسال طلب الشراء</button>
      </div>
    </form>
  </div>

  <div class="status-screen" id="successScreen" style="display:none;">
    <h2>تم تسجيل مواصفات طلبك بنجاح</h2>
  </div>
</div>

<script>
  // الرابط الخاص بك مدمج هنا تلقائياً
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZT6e00lTA97hv6chwCLDEkls3wTVUT0SBVg-R6SXmdPXeZbNWPdNktIplous2cIbt/exec";

  const irrRadios = document.querySelectorAll('input[name="irrigation"]');
  const salinityBox = document.getElementById('salinityBox');
  irrRadios.forEach(r => r.addEventListener('change', () => {
    const val = document.querySelector('input[name="irrigation"]:checked')?.value || "";
    if(val.includes('آبار')) salinityBox.classList.add('show');
    else salinityBox.classList.remove('show');
  }));

  const statusRadios = document.querySelectorAll('input[name="desired_land_status"]');
  const treeTypeBox = document.getElementById('treeTypeBox');
  statusRadios.forEach(r => r.addEventListener('change', () => {
    const val = document.querySelector('input[name="desired_land_status"]:checked')?.value || "";
    if(val.includes('متشجر')) treeTypeBox.classList.add('show');
    else treeTypeBox.classList.remove('show');
  }));

  const form = document.getElementById('buyerForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errorBox.classList.remove('show');

    const requiredRadioGroups = ['irrigation','soil_type','desired_land_status'];
    for(const g of requiredRadioGroups){
      if(!document.querySelector(`input[name="${g}"]:checked`)){
        errorBox.textContent = "من فضلك اختار كل الحقول المطلوبة قبل الإرسال.";
        errorBox.classList.add('show');
        return;
      }
    }

    const landStatus = document.querySelector('input[name="desired_land_status"]:checked').value;
    if(landStatus.includes('متشجر') && !document.getElementById('tree_types').value.trim()){
      errorBox.textContent = "برجاء تحديد نوع الشجر المطلوب.";
      errorBox.classList.add('show');
      return;
    }

    if(!form.buyer_name.value.trim() || !form.buyer_phone.value.trim() || !form.required_area.value.trim() || !form.required_location.value.trim()){
      errorBox.textContent = "من فضلك اكمل كل الحقول المطلوبة قبل الإرسال.";
      errorBox.classList.add('show');
      return;
    }

    const data = new FormData(form);
    const payload = {
      formType: 'buyer',
      timestamp: new Date().toISOString(),
      buyer_name: data.get('buyer_name'),
      buyer_phone: data.get('buyer_phone'),
      buyer_address: data.get('buyer_address'),
      required_area: data.get('required_area'),
      required_location: data.get('required_location'),
      irrigation: data.get('irrigation'),
      water_salinity: data.get('water_salinity'),
      soil_type: data.get('soil_type'),
      desired_land_status: landStatus,
      tree_types: data.get('tree_types') || '',
      services: data.getAll('services').join('، '),
      buildings: data.getAll('buildings').join('، '),
      road_location: data.getAll('road_location').join('، '),
      purpose: data.get('purpose') || '',
      other_specs: data.get('other_specs') || ''
    };

    submitBtn.disabled = true;
    submitBtn.textContent = "بنسجّل البيانات...";

    try{
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type':'text/plain'},
        body: JSON.stringify(payload)
      });
      document.getElementById('formScreen').style.display = 'none';
      document.getElementById('successScreen').style.display = 'block';
    }catch(err){
      submitBtn.disabled = false;
      submitBtn.textContent = "إرسال طلب الشراء";
      errorBox.textContent = "حصل خطأ في إرسال البيانات. حاول مرة أخرى.";
      errorBox.classList.add('show');
    }
  });
</script>
</body>
</html>
