<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة الحمد للاستثمار الزراعي والعقاري - بيانات الأرض المعروضة للبيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --soil-900:#2b1f16;
    --soil-700:#4a3525;
    --soil-500:#7a5a3e;
    --wheat-100:#f4ecd9;
    --wheat-50:#faf6ec;
    --canal-500:#2f6e6a;
    --canal-700:#214f4c;
    --rust-500:#b5532e;
    --paper:#fffdf8;
    --line:#d9cdb0;
    --ink:#2b1f16;
    --ink-soft:#6b5d4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--wheat-100);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(47,110,106,0.06), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(181,83,46,0.06), transparent 40%);
    font-family:'Cairo', sans-serif;
    color:var(--ink);
    min-height:100vh;
    direction:rtl;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 80px;}

  /* HERO */
  .hero{
    padding:48px 18px 36px;
    position:relative;
    overflow:hidden;
    background:var(--soil-900);
    color:var(--wheat-50);
    margin-bottom:28px;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(to left, rgba(244,236,217,0.07) 1px, transparent 1px),
      linear-gradient(to top, rgba(244,236,217,0.07) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent 85%);
    pointer-events:none;
  }
  .hero-inner{max-width:760px;margin:0 auto;position:relative;z-index:1;}
  .eyebrow{
    font-size:13px; letter-spacing:.04em; color:var(--rust-500);
    background:rgba(244,236,217,0.08);
    border:1px solid rgba(244,236,217,0.18);
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 14px; border-radius:999px; font-weight:700;
  }
  .eyebrow svg{width:14px;height:14px;flex-shrink:0;}
  h1.title{
    font-family:'Markazi Text', serif;
    font-size:clamp(34px,6vw,46px);
    margin:18px 0 8px;
    line-height:1.15;
    font-weight:700;
    color:var(--wheat-50);
  }

  .brand-row{
    display:flex; align-items:center; gap:14px; margin-bottom:22px;
  }
  .brand-logo{
    width:56px; height:56px; flex-shrink:0;
  }
  .brand-name{
    font-family:'Markazi Text', serif;
    font-size:22px; font-weight:700; color:var(--wheat-50);
    line-height:1.3;
  }
  .brand-name small{
    display:block; font-family:'Cairo', sans-serif; font-size:12.5px;
    font-weight:600; color:#cdbfa4; letter-spacing:.02em; margin-top:2px;
  }

  /* SECTION CARD */
  .section{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 22px;
    margin-bottom:18px;
    box-shadow:0 1px 2px rgba(43,31,22,0.04);
  }
  .section-head{
    display:flex; align-items:baseline; gap:10px;
    margin-bottom:18px; padding-bottom:14px;
    border-bottom:1px dashed var(--line);
  }
  .section-num{
    font-family:'Markazi Text', serif;
    font-size:26px; color:var(--canal-500); font-weight:700; line-height:1;
  }
  .section-title{font-size:18px; font-weight:800; color:var(--soil-900);}

  .field{margin-bottom:18px;}
  label.flabel{
    display:block; font-size:14.5px; font-weight:700; color:var(--soil-700);
    margin-bottom:8px;
  }
  label.flabel .req{color:var(--rust-500); margin-right:4px;}

  input[type=text], input[type=tel], textarea{
    width:100%; padding:13px 14px; border-radius:9px;
    border:1.5px solid var(--line); background:var(--wheat-50);
    font-family:'Cairo', sans-serif; font-size:15.5px; color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus{
    outline:none; border-color:var(--canal-500);
    box-shadow:0 0 0 3px rgba(47,110,106,0.12);
    background:var(--paper);
  }
  textarea{resize:vertical; min-height:90px; line-height:1.6;}

  .chip-grid{display:flex; flex-wrap:wrap; gap:9px;}
  .chip{position:relative;}
  .chip input{position:absolute; opacity:0; width:1px; height:1px;}
  .chip label{
    display:flex; align-items:center; gap:7px;
    padding:10px 16px; border-radius:9px;
    border:1.5px solid var(--line); background:var(--wheat-50);
    font-size:14.5px; font-weight:600; color:var(--soil-700);
    cursor:pointer; transition:all .15s; user-select:none;
  }
  .chip label::before{
    content:""; width:15px; height:15px; border-radius:50%;
    border:2px solid #c2b394; flex-shrink:0; transition:all .15s;
  }
  .chip.multi label::before{border-radius:4px;}
  .chip input:checked + label{
    background:var(--canal-700); border-color:var(--canal-700); color:#fff;
  }
  .chip input:checked + label::before{
    border-color:#fff; background:#fff;
    box-shadow:inset 0 0 0 3px var(--canal-700);
  }

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){.row2{grid-template-columns:1fr;}}

  .conditional{
    margin-top:14px; padding:14px 14px; border-radius:10px;
    background:var(--wheat-100); border:1px dashed var(--canal-500);
    display:none;
  }
  .conditional.show{display:block;}

  .submit-bar{margin-top:8px; text-align:center;}
  button.submit{
    width:100%;
    background:var(--rust-500); color:#fff; border:none;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:17px;
    padding:17px 20px; border-radius:11px; cursor:pointer;
    box-shadow:0 4px 0 #8a3d20;
    transition:transform .1s, box-shadow .1s;
  }
  button.submit:active{transform:translateY(3px); box-shadow:0 1px 0 #8a3d20;}
  button.submit:disabled{opacity:.6; cursor:wait;}

  .status-screen{text-align:center; padding:70px 20px;}
  .status-screen h2{font-family:'Markazi Text',serif; font-size:30px; color:var(--soil-900); margin:18px 0 8px;}
  .error-box{
    background:#fbe9e2; border:1px solid #e2a98c; color:#8a3d20;
    border-radius:10px; padding:13px 14px; font-size:14px; margin-top:14px; display:none; line-height:1.6;
  }
  .error-box.show{display:block;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="brand-row">
      <div class="brand-name">
        شركة الحمد
        <small>للاستثمار الزراعي والعقاري</small>
      </div>
    </div>
    <span class="eyebrow">بيانات أرض معروضة للبيع</span>
    <h1 class="title">استمارة بيانات الأرض</h1>
  </div>
</div>

<div class="wrap">
  <div id="formScreen">
    <form id="sellerForm" novalidate>

      <div class="section">
        <div class="section-head">
          <span class="section-num">01</span>
          <span class="section-title">بيانات صاحب الأرض</span>
        </div>
        <div class="field">
          <label class="flabel">الاسم<span class="req">*</span></label>
          <input type="text" name="owner_name" required placeholder="الاسم بالكامل">
        </div>
        <div class="row2">
          <div class="field">
            <label class="flabel">التليفون<span class="req">*</span></label>
            <input type="tel" name="owner_phone" required placeholder="01xxxxxxxxx" inputmode="tel">
          </div>
          <div class="field">
            <label class="flabel">العنوان</label>
            <input type="text" name="owner_address" placeholder="العنوان بالتفصيل">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <span class="section-num">02</span>
          <span class="section-title">بيانات الأرض</span>
        </div>

        <div class="row2">
          <div class="field">
            <label class="flabel">المساحة<span class="req">*</span></label>
            <input type="text" name="land_area" required placeholder="مثال: 5 فدان">
          </div>
          <div class="field">
            <label class="flabel">المكان<span class="req">*</span></label>
            <input type="text" name="land_location" required placeholder="المحافظة / المركز / القرية">
          </div>
        </div>

        <div class="field">
          <label class="flabel">نوع الري<span class="req">*</span></label>
          <div class="chip-grid">
            <div class="chip"><input type="radio" name="irrigation" id="irr1" value="بحاري" required><label for="irr1">بحاري</label></div>
            <div class="chip"><input type="radio" name="irrigation" id="irr2" value="آبار أعماق"><label for="irr2">آبار أعماق</label></div>
            <div class="chip"><input type="radio" name="irrigation" id="irr4" value="بحاري وآبار"><label for="irr4">بحاري وآبار</label></div>
            <div class="chip"><input type="radio" name="irrigation" id="irr5" value="بحاري وخزان"><label for="irr5">بحاري وخزان</label></div>
          </div>
          <div class="conditional" id="salinityBox">
            <div class="field">
              <label class="flabel">نسبة ملوحة المياه</label>
              <input type="text" name="water_salinity" placeholder="نسبة الملوحة">
            </div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">نوع التربة<span class="req">*</span></label>
          <div class="chip-grid">
            <div class="chip"><input type="radio" name="soil_type" id="soil1" value="طينية" required><label for="soil1">طينية</label></div>
            <div class="chip"><input type="radio" name="soil_type" id="soil2" value="صفرا"><label for="soil2">صفرا</label></div>
            <div class="chip"><input type="radio" name="soil_type" id="soil3" value="طفلة"><label for="soil3">طفلة</label></div>
            <div class="chip"><input type="radio" name="soil_type" id="soil4" value="حمرا"><label for="soil4">حمرا</label></div>
            <div class="chip"><input type="radio" name="soil_type" id="soil5" value="سفوة"><label for="soil5">سفوة</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">حالة الأرض<span class="req">*</span></label>
          <div class="chip-grid">
            <div class="chip"><input type="radio" name="land_status" id="status1" value="متشجرة بالكامل" required><label for="status1">متشجرة بالكامل</label></div>
            <div class="chip"><input type="radio" name="land_status" id="status2" value="محاصيل بالكامل"><label for="status2">محاصيل بالكامل</label></div>
            <div class="chip"><input type="radio" name="land_status" id="status3" value="جزء متشجر وجزء محاصيل"><label for="status3">جزء متشجر وجزء محاصيل</label></div>
            <div class="chip"><input type="radio" name="land_status" id="status4" value="لم تزرع بعد"><label for="status4">لم تزرع بعد</label></div>
          </div>
          <div class="conditional" id="treeTypeBox">
            <div class="field">
              <label class="flabel">نوع الشجر والتفصيل<span class="req">*</span></label>
              <input type="text" name="tree_types" id="tree_types" placeholder="مثال: 5 فدان عنب، 2 فدان موالح، 2 فدان خوخ">
            </div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">شبكة الري<span class="req">*</span></label>
          <div class="chip-grid">
            <div class="chip"><input type="radio" name="irrigation_network" id="net1" value="شبكة تنقيط كاملة" required><label for="net1">شبكة تنقيط كاملة</label></div>
            <div class="chip"><input type="radio" name="irrigation_network" id="net2" value="ري غمر"><label for="net2">ري غمر</label></div>
            <div class="chip"><input type="radio" name="irrigation_network" id="net3" value="خط رئيسي فقط"><label for="net3">خط رئيسي فقط</label></div>
            <div class="chip"><input type="radio" name="irrigation_network" id="net4" value="لا يوجد شبكة ري"><label for="net4">لا يوجد شبكة ري</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">الخدمات المتاحة</label>
          <div class="chip-grid">
            <div class="chip multi"><input type="checkbox" name="services" id="serv1" value="كهرباء"><label for="serv1">كهرباء</label></div>
            <div class="chip multi"><input type="checkbox" name="services" id="serv2" value="مياه شرب"><label for="serv2">مياه شرب</label></div>
            <div class="chip multi"><input type="checkbox" name="services" id="serv3" value="طاقة شمسية"><label for="serv3">طاقة شمسية</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">المباني الموجودة (اختيار متعدد)</label>
          <div class="chip-grid">
            <div class="chip multi"><input type="checkbox" name="buildings" id="bld1" value="فيلا"><label for="bld1">فيلا</label></div>
            <div class="chip multi"><input type="checkbox" name="buildings" id="bld2" value="بيت مسلح"><label for="bld2">بيت مسلح</label></div>
            <div class="chip multi"><input type="checkbox" name="buildings" id="bld3" value="بيت ريفي"><label for="bld3">بيت ريفي</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">الموقع (اختيار متعدد)</label>
          <div class="chip-grid">
            <div class="chip multi"><input type="checkbox" name="road_location" id="rd1" value="طريق عمومي"><label for="rd1">على طريق عمومي</label></div>
            <div class="chip multi"><input type="checkbox" name="road_location" id="rd2" value="طريق فرعي"><label for="rd2">طريق فرعي</label></div>
            <div class="chip multi"><input type="checkbox" name="road_location" id="rd3" value="مدق"><label for="rd3">مدق</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">الغرض من البيع (اختيار متعدد)</label>
          <div class="chip-grid">
            <div class="chip multi"><input type="checkbox" name="pur_another_area" id="p1" value="شراء فى منطقة اخرى"><label for="p1">شراء فى منطقة اخرى</label></div>
            <div class="chip multi"><input type="checkbox" name="pur_leave_agri" id="p2" value="ترك المجال الزراعي"><label for="p2">ترك المجال الزراعي</label></div>
            <div class="chip multi"><input type="checkbox" name="pur_change_activity" id="p3" value="تغيير النشاط"><label for="p3">تغيير النشاط</label></div>
            <div class="chip multi"><input type="checkbox" name="pur_land_trade" id="p4" value="تجارة اراضي"><label for="p4">تجارة اراضي</label></div>
            <div class="chip multi"><input type="checkbox" name="pur_other" id="p5" value="اخرى"><label for="p5">اخرى</label></div>
          </div>
        </div>

        <div class="field">
          <label class="flabel">مواصفات أخرى</label>
          <textarea name="other_specs" placeholder="أي تفاصيل إضافية عن الأرض..."></textarea>
        </div>
      </div>

      <div class="error-box" id="errorBox"></div>
      <div class="submit-bar">
        <button type="submit" class="submit" id="submitBtn">إرسال بيانات الأرض</button>
      </div>
    </form>
  </div>

  <div class="status-screen" id="successScreen" style="display:none;">
    <h2>تم استلام بيانات الأرض بنجاح</h2>
  </div>
</div>

<script>
  // الرابط الخاص بك مدمج هنا تلقائياً
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZT6e00lTA97hv6chwCLDEkls3wTVUT0SBVg-R6SXmdPXeZbNWPdNktIplous2cIbt/exec";

  const irrRadios = document.querySelectorAll('input[name="irrigation"]');
  const salinityBox = document.getElementById('salinityBox');
  irrRadios.forEach(r => r.addEventListener('change', () => {
    const val = document.querySelector('input[name="irrigation"]:checked')?.value || "";
    if(val.includes('آبار')) salinityBox.classList.add('show');
    else salinityBox.classList.remove('show');
  }));

  const statusRadios = document.querySelectorAll('input[name="land_status"]');
  const treeTypeBox = document.getElementById('treeTypeBox');
  statusRadios.forEach(r => r.addEventListener('change', () => {
    const val = document.querySelector('input[name="land_status"]:checked')?.value || "";
    if(val.includes('متشجر')) treeTypeBox.classList.add('show');
    else treeTypeBox.classList.remove('show');
  }));

  const form = document.getElementById('sellerForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errorBox.classList.remove('show');

    const requiredRadioGroups = ['irrigation','soil_type','land_status','irrigation_network'];
    for(const g of requiredRadioGroups){
      if(!document.querySelector(`input[name="${g}"]:checked`)){
        errorBox.textContent = "من فضلك اختار كل الحقول المطلوبة قبل الإرسال.";
        errorBox.classList.add('show');
        return;
      }
    }

    const landStatus = document.querySelector('input[name="land_status"]:checked').value;
    if(landStatus.includes('متشجر') && !document.getElementById('tree_types').value.trim()){
      errorBox.textContent = "برجاء كتابة نوع الشجر وتفصيله.";
      errorBox.classList.add('show');
      return;
    }

    if(!form.owner_name.value.trim() || !form.owner_phone.value.trim() || !form.land_area.value.trim() || !form.land_location.value.trim()){
      errorBox.textContent = "من فضلك اكمل كل الحقول المطلوبة قبل الإرسال.";
      errorBox.classList.add('show');
      return;
    }

    const data = new FormData(form);
    const payload = {
      formType: 'seller',
      timestamp: new Date().toISOString(),
      owner_name: data.get('owner_name'),
      owner_phone: data.get('owner_phone'),
      owner_address: data.get('owner_address'),
      land_area: data.get('land_area'),
      land_location: data.get('land_location'),
      irrigation: data.get('irrigation'),
      water_salinity: data.get('water_salinity'),
      soil_type: data.get('soil_type'),
      land_status: landStatus,
      tree_types: data.get('tree_types') || '',
      irrigation_network: data.get('irrigation_network'),
      services: data.getAll('services').join('، '),
      buildings: data.getAll('buildings').join('، '),
      road_location: data.getAll('road_location').join('، '),
      pur_another_area: data.get('pur_another_area') ? 'نعم' : '',
      pur_leave_agri: data.get('pur_leave_agri') ? 'نعم' : '',
      pur_change_activity: data.get('pur_change_activity') ? 'نعم' : '',
      pur_land_trade: data.get('pur_land_trade') ? 'نعم' : '',
      pur_other: data.get('pur_other') ? 'نعم' : '',
      other_specs: data.get('other_specs') || ''
    };

    submitBtn.disabled = true;
    submitBtn.textContent = "بنسجّل البيانات...";

    try{
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type':'text/plain'},
        body: JSON.stringify(payload)
      });
      document.getElementById('formScreen').style.display = 'none';
      document.getElementById('successScreen').style.display = 'block';
    }catch(err){
      submitBtn.disabled = false;
      submitBtn.textContent = "إرسال بيانات الأرض";
      errorBox.textContent = "حصل خطأ في إرسال البيانات. حاول مرة أخرى.";
      errorBox.classList.add('show');
    }
  });
</script>
</body>
</html>
